<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Activity — ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="activity" data-nav="activity" data-title="Activity" data-mesh>

<!-- The ground: the same gradient Home and the landing page carry, injected by the same
     markup and styled by the same rules (see "Home: animated mesh gradient" in
     styles.css). `data-mesh` on <body> is the switch — it is what turns the body into
     a stacking context, drops the grounds that would paint over the layer, and rests
     the top bar on it. -->
<div class="meshbg" aria-hidden="true">
  <span class="mb-lav"></span><span class="mb-lav2"></span><span class="mb-cream2"></span>
</div>


<div id="shellMain">
<div class="licview" id="activityView">
  <!-- ⚠️ ONE FRAME: toolbar, column row and rows are one block, so they are one thing to
       read and, on scroll, one thing that stays. Nothing loose between the title and the
       frame. `.stickybar` is the toolbar, `.stickyhead` the column row; the offset the
       column row sticks at is the toolbar's MEASURED height (`--barH`), because this
       toolbar is a different height on every page and wraps at narrow widths. -->
  <!-- ⚠️ NO COLUMN ROW HERE. Activity is a feed, not a table, so the toolbar is the only
       thing that sticks — there is no `.stickyhead` to sit beneath it. -->
  <!-- ⚠️ THE TITLE IS INSIDE THE FRAME. It was above it, and the frame began at the
       toolbar; the page then read as a loose heading followed by a box. One block now:
       title, toolbar, column row, rows. The title still SCROLLS AWAY — it is in the
       frame, not in the sticky part of it. -->
  <div class="listcard listframe">
  <!-- ⚠️ THE COUNT CHIP, the same one Licenses and Instances carry (2026-10-01, by
       request). Same class, same place, same reading: it states how many the ACCOUNT
       has, and the controls below narrow what is shown without changing it. A chip
       rather than Home's button, because there is nowhere further to go from here.
       Filled by renderActFeed. -->
  <div class="lic-titlerow">
    <h1 class="lic-h1">Activity</h1>
    <span class="titlecount" id="actTotal"></span>
  </div>
  <!-- ⚠️ ONE ROW AGAIN. The type filter was four chips and needed a row of its own; as a
       single dropdown it sits beside the period control, where it belongs — the two ask
       the same kind of question about the same list. -->
  <div class="insttoolbar stickybar">
    <div class="searchbox"><svg class="ic searchglyph" aria-hidden="true"><use href="assets/icons.svg#ti-search"></use></svg><input type="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Search activity" aria-label="Search activity"></div>
    <!-- ⚠️ ONE GROUP AROUND THE FILTERS, `display:contents` above the breakpoint — so the
         desktop row is laid out from exactly the same children it always was — and the
         phone's SECOND ROW below it: one line that scrolls sideways. Three siblings
         cannot become a scroll container without a box around them, and that is all this
         box is. Same pattern the Licenses toolbar carries (2026-10-01, by request:
         "move the Licenses filter and search pattern to the other inner pages"). -->
    <div class="barfilters">
    <!-- ⚠️ `id="actPeriod"` IS WHAT `wirePeriod` HAS ALWAYS BEEN PASSED and never had:
         the call named it, the markup did not, and the function quietly fell back to
         `$('.perctl')` — the first such box on the page, which happened to be this one.
         The phone's sheet needs a selector that cannot depend on document order. -->
    <div class="dropwrap perctl" id="actPeriod">
      <button class="btn btn--secondary btn--md perbtn" aria-haspopup="true" aria-expanded="false" aria-label="Period"><b class="perlabel">All time</b> <svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></button>
      <div class="dropmenu permenu" hidden>
                    <button type="button" role="menuitemradio" data-period="all">All time</button>
                    <button type="button" role="menuitemradio" data-period="24h">Last 24 hours</button>
                    <button type="button" role="menuitemradio" data-period="7d">Last 7 days</button>
                    <button type="button" role="menuitemradio" data-period="30d">Last 30 days</button>
                    <button type="button" role="menuitemradio" data-period="custom">Custom range&hellip;</button>
                    <div class="percustom">
                      <div class="perrow">
                        <input type="date" class="perfrom" aria-label="From date">
                        <span class="permid">to</span>
                        <input type="date" class="perto" aria-label="To date">
                      </div>
                      <button class="btn btn--secondary btn--md perapply">Apply</button>
                    </div>
                  </div>
    </div>
    <!-- multi-select: the trigger states the current answer, the menu holds the four
         kinds and stays open while they are ticked (see renderActTypes) -->
    <div class="dropwrap perctl acttypectl">
      <button class="btn btn--secondary btn--md perbtn" aria-haspopup="true" aria-expanded="false" aria-label="Event types"><b id="actTypeLabel">All event types</b> <svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></button>
      <div class="dropmenu acttypemenu" id="actTypeMenu" role="menu" hidden></div>
    </div>
    </div>
    <!-- the phone's THIRD ROW: what is applied, as chips you can take off, with a
         `Clear all` at the end. Filled by the page; `hidden` is set there, so an empty
         row never costs a line of the screen. -->
    <div class="barapplied" id="actApplied" hidden></div>
    <span class="spacer"></span>
    <button class="btn btn--secondary btn--md btn--icon" data-refresh aria-label="Refresh" title="Refresh"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-refresh"></use></svg></button>
  </div>

  <!-- chronological feed, rendered from ACTIVITY (newest first) -->
  <div class="feed" id="actFeed"></div>
  <!-- ⚠️ NO PAGER (2026-09-28, by request). It was added on 09-25 because the derived
       check-ins put well over a thousand entries here — measured at 22,093px of scroll
       — and a footer saying `1-1400 of 1400` under all of them was worse than paging.
       Two things changed since: the successful checks FOLD into one row per run, which
       is what took the list from ~1400 to 315, and the feed became an axis you scan
       rather than a stack of cards you read. What is left is a long page, which is what
       a log is. ⚠️ If it grows again the answer is the shared controller
       (`pageSlice`/`syncPager`/`wirePager`), not this markup back. -->
  </div>
</div>
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<!-- ⚠️ `wizard.js` and `license-details.js` are loaded here for the same reason the
     Invoices and Instances pages load them (2026-09-29): the feed's sentences now name
     the licence an event belongs to and link it, and the delegated interceptor in
     components.js only opens that licence as a panel `if(window.LicenseDetails)`.
     Without them the guard fails silently and the link follows its href to the full
     page — so this one route would land somewhere every other licence link in the
     product does not. `wizard.js` comes with it because the panel's actions call `NL`. -->
<script src="components.js"></script>
<script src="wizard.js"></script>
<script src="license-details.js"></script>
<script src="page-activity.js"></script>
</body>
</html>
