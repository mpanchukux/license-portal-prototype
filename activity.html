<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Activity — ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="activity" data-nav="activity" data-title="Activity">

<div id="shellMain">
<div class="licview" id="activityView">
  <!-- ⚠️ ONE FRAME: toolbar, column row and rows are one block, so they are one thing to
       read and, on scroll, one thing that stays. Nothing loose between the title and the
       frame. `.stickybar` is the toolbar, `.stickyhead` the column row; the offset the
       column row sticks at is the toolbar's MEASURED height (`--barH`), because this
       toolbar is a different height on every page and wraps at narrow widths. -->
  <!-- ⚠️ NO COLUMN ROW HERE. Activity is a feed, not a table, so the toolbar is the only
       thing that sticks — there is no `.stickyhead` to sit beneath it. -->
  <!-- ⚠️ THE TITLE IS INSIDE THE FRAME. It was above it, and the frame began at the
       toolbar; the page then read as a loose heading followed by a box. One block now:
       title, toolbar, column row, rows. The title still SCROLLS AWAY — it is in the
       frame, not in the sticky part of it. -->
  <div class="listcard listframe">
  <h1 class="lic-h1">Activity</h1>
  <!-- ⚠️ ONE ROW AGAIN. The type filter was four chips and needed a row of its own; as a
       single dropdown it sits beside the period control, where it belongs — the two ask
       the same kind of question about the same list. -->
  <div class="insttoolbar stickybar">
    <div class="searchbox"><svg class="ic searchglyph" aria-hidden="true"><use href="assets/icons.svg#ti-search"></use></svg><input type="text" placeholder="Search activity" aria-label="Search activity"></div>
    <div class="dropwrap perctl">
      <button class="btn sec perbtn" aria-haspopup="true" aria-expanded="false" aria-label="Period"><b class="perlabel">All time</b> <svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></button>
      <div class="dropmenu permenu" hidden>
                    <button data-period="all">All time</button>
                    <button data-period="24h">Last 24 hours</button>
                    <button data-period="7d">Last 7 days</button>
                    <button data-period="30d">Last 30 days</button>
                    <button data-period="custom">Custom range&hellip;</button>
                    <div class="percustom">
                      <div class="perrow">
                        <input type="date" class="perfrom" aria-label="From date">
                        <span class="permid">to</span>
                        <input type="date" class="perto" aria-label="To date">
                      </div>
                      <button class="btn sec perapply">Apply</button>
                    </div>
                  </div>
    </div>
    <!-- multi-select: the trigger states the current answer, the menu holds the four
         kinds and stays open while they are ticked (see renderActTypes) -->
    <div class="dropwrap perctl acttypectl">
      <button class="btn sec perbtn" aria-haspopup="true" aria-expanded="false" aria-label="Event types"><b id="actTypeLabel">All event types</b> <svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></button>
      <div class="dropmenu acttypemenu" id="actTypeMenu" role="menu" hidden></div>
    </div>
    <span class="spacer"></span>
    <button class="iconbtn ib" data-refresh aria-label="Refresh" title="Refresh"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-refresh"></use></svg></button>
  </div>

  <!-- chronological feed, rendered from ACTIVITY (newest first) -->
  <div class="feed" id="actFeed"></div>
  <div class="pager air">
    <span class="spacer"></span>
    <span>Items per page<select aria-label="Items per page"><option>10</option><option>20</option><option>50</option><option>100</option></select></span>
    <span class="range" id="actRange">1–5 of 5</span>
    <span class="pagebtns">
      <button disabled aria-label="First page"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevrons-left"></use></svg></button><button disabled aria-label="Previous page"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-left"></use></svg></button><button disabled aria-label="Next page"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-right"></use></svg></button><button disabled aria-label="Last page"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevrons-right"></use></svg></button>
    </span>
  </div>
  </div>
</div>
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="components.js"></script>
<script src="page-activity.js"></script>
</body>
</html>
