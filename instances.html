<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Instances — ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="instances" data-nav="instances" data-title="Instances" data-mesh>

<!-- The ground: the same gradient Home and the landing page carry, injected by the same
     markup and styled by the same rules (see "Home: animated mesh gradient" in
     styles.css). `data-mesh` on <body> is the switch — it is what turns the body into
     a stacking context, drops the grounds that would paint over the layer, and rests
     the top bar on it. -->
<div class="meshbg" aria-hidden="true">
  <span class="mb-lav"></span><span class="mb-lav2"></span><span class="mb-cream2"></span>
</div>


<div id="shellMain">
<div class="licview" id="instancesView">
  <!-- ⚠️ ONE FRAME: toolbar, column row and rows are one block, so they are one thing to
       read and, on scroll, one thing that stays. Nothing loose between the title and the
       frame. `.stickybar` is the toolbar, `.stickyhead` the column row; the offset the
       column row sticks at is the toolbar's MEASURED height (`--barH`), because this
       toolbar is a different height on every page and wraps at narrow widths. -->
  <!-- ⚠️ THE TITLE IS INSIDE THE FRAME. It was above it, and the frame began at the
       toolbar; the page then read as a loose heading followed by a box. One block now:
       title, toolbar, column row, rows. The title still SCROLLS AWAY — it is in the
       frame, not in the sticky part of it. -->
  <div class="listcard listframe">
  <!-- ⚠️ A PLAIN h1, not a tablist carrying the title: the Licenses page hides its
       heading because the view tabs took its weight, and this page has no tabs. -->
  <!-- ⚠️ THE HINT SITS WITH THE TITLE (2026-09-24), not above the table. It used to be
       a full-bleed line between the toolbar and the column row, which put a sentence
       between two controls and pushed the rows down by its whole height. Beside the
       title it is what it always was — the page's one piece of standing advice — and it
       costs the table nothing. Baselines are aligned, so the sentence reads as a
       subtitle of the heading rather than as a line that happens to be near it. -->
  <!-- ⚠️ THE COUNT CHIP, the same one Licenses carries (2026-09-29, by request). Same
       class, same place, same reading: it states how many the ACCOUNT has, and the
       controls below narrow what is shown without changing it. A chip rather than
       Home's button, for the same reason Licenses uses one — there is nowhere further
       to go from here. Filled by renderInstancesPage.
       ⚠️ It sits BETWEEN the title and the hint. `.lic-titlerow:has(> .titlecount)`
       turns the row into a flex line, so the hint joins that line as a third item and
       keeps the baseline it already had beside the heading. -->
  <div class="lic-titlerow">
    <h1 class="lic-h1">Instances</h1>
    <span class="titlecount" id="instTotal"></span>
  </div>
  <!-- ⚠️⚠️ THE SENTENCE IS UNDER THE HEADING NOW (2026-10-01, by request), not a third
       item in its row. It had been placed beside the title deliberately — "a subtitle of
       the heading rather than a line that happens to be near it" — and the half of that
       argument which survives is the RELATIONSHIP, not the row: under the heading it is
       still the page's standing advice and is still read as its subtitle, and it stops
       competing with the count for the same line. It also stops the row from wrapping
       into two lines at narrow widths, which is where the three-item version broke.
       ⚠️ A SIBLING OF THE ROW, not a child of it: `.lic-titlerow:has(> .titlecount)` is a
       flex line, so left inside it the sentence would simply re-join that line. -->
  <p class="inst-hint">Moved a deployment to a new server? Deactivate the old instance and
    activate the new one with the same key.</p>
  <div class="listbar insttoolbar stickybar">
    <div class="searchbox"><svg class="ic searchglyph" aria-hidden="true"><use href="assets/icons.svg#ti-search"></use></svg><input type="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Search instances" aria-label="Search instances"></div>
    <!-- ⚠️⚠️ ONE SWITCH, NOT A CHIP PAIR (2026-09-29, by request), and this REVERSES
         "STATUS IS THE ONE HONEST PARTITION HERE" — the argument that put a
         mutually-exclusive `Healthy`/`Stale` group here in the first place. That
         argument is not wrong, it is answering a question nobody asks: `Healthy` is
         the state of seventeen of nineteen rows, so pressing it hides two and leaves
         the list looking unchanged. The one thing a reader comes here to do is find
         what has STOPPED reporting, and that is an on/off, not a partition.
         ⚠️⚠️ AND IT IS A CHIP AGAIN, NOT A SWITCH (2026-09-30, by request) — but ONE
         chip, not the mutually exclusive pair. Both halves of the history survive: the
         partition stays dead (nobody asks for `Healthy`, which is seventeen rows of
         nineteen), and the facet count comes BACK, which is what the switch could not
         carry. The line that stood here — "a switch has one state to count and the
         column already says which rows it would leave" — is what the request overrules:
         the number is worth stating BEFORE the press, not after it.
         ⚠️ Same component as the Licenses toolbar's `Needs attention`, deliberately:
         both are one independent on/off that narrows a list and states its own size.
         ⚠️ Version is still NOT a filter: "behind latest" is a fact about a release,
         not a state of the deployment. -->
    <!-- ⚠️ ONE GROUP AROUND THE FILTERS, `display:contents` above the breakpoint — so the
         desktop row is laid out from exactly the same children it always was — and the
         phone's SECOND ROW below it: one line that scrolls sideways. Three siblings
         cannot become a scroll container without a box around them, and that is all this
         box is. Same pattern the Licenses toolbar carries (2026-10-01, by request:
         "move the Licenses filter and search pattern to the other inner pages"). -->
    <div class="barfilters">
    <!-- the tick is last — see the note on the same chip in licenses.html -->
    <button class="filterchip attnchip" id="instStaleChip" aria-pressed="false">
      <span>Stale <span class="chipcount" id="instStaleCount"></span></span>
      <svg class="ic cc-check" aria-hidden="true"><use href="assets/icons.svg#ti-check"></use></svg></button>
    </div>
    <!-- the phone's THIRD ROW: what is applied, as chips you can take off, with a
         `Clear all` at the end. Filled by the page; `hidden` is set there, so an empty
         row never costs a line of the screen. -->
    <div class="barapplied" id="instApplied" hidden></div>
    <span class="spacer"></span>
    <!-- ⚠️⚠️ A SWITCH, NOT A SEGMENTED PAIR (2026-09-29, by request). The `.seg` radios
         said "All instances / By license" — two names for two views, which reads as two
         destinations. Grouping is not a second list, it is one list with the rows
         gathered, so the control is the thing it does and has an off state.
         ⚠️ OFF BY DEFAULT, and the default is the plain list. The radios defaulted to
         flat too, so nothing about what opens has changed — but a switch makes the
         default legible: you can see that grouping is something you turn ON.
         ⚠️ It sits AFTER the spacer for the reason the radios did: the control on the
         left NARROWS the list, this one only rearranges it. Filters left, presentation
         right, beside Refresh. -->
    <label class="lic-toggle"><span class="switch"><input type="checkbox" id="instGroupSwitch"><span class="track"></span></span> Group by license</label>
    <button class="btn btn--secondary btn--md btn--icon" data-refresh aria-label="Refresh" title="Refresh"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-refresh"></use></svg></button>
  </div>

  <div id="instancesList">
    <!-- states the filter the blocked banner arrived with, and carries the way out of it -->
    <p class="inst-filter" id="instFilter" hidden></p>
    <div class="tablescroll">
      <table id="instTable">
        <thead id="instAllHead" class="stickyhead"></thead>
        <tbody id="instAllBody"></tbody>
      </table>
    </div>
    <!-- ⚠️ A FULL PAGER, and it was a range label on its own. Nineteen instances against
         a ten-row page is two pages, and the surface had no way to reach the second. -->
    <div class="pager">
      <span class="spacer"></span>
      <span>Items per page<span class="selwrap"><select aria-label="Items per page"><option>10</option><option>20</option><option>50</option><option>100</option></select><svg class="ic selchev" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></span></span>
      <span class="range">0 of 0</span>
      <span class="pagebtns">
        <button type="button" class="btn btn--secondary btn--md btn--icon" disabled aria-disabled="true" aria-label="First page"><svg class="ic btn-ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevrons-left"></use></svg></button>
        <button type="button" class="btn btn--secondary btn--md btn--icon" disabled aria-disabled="true" aria-label="Previous page"><svg class="ic btn-ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-left"></use></svg></button>
        <button type="button" class="btn btn--secondary btn--md btn--icon" disabled aria-disabled="true" aria-label="Next page"><svg class="ic btn-ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-right"></use></svg></button>
        <button type="button" class="btn btn--secondary btn--md btn--icon" disabled aria-disabled="true" aria-label="Last page"><svg class="ic btn-ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevrons-right"></use></svg></button>
      </span>
    </div>
  </div><!-- /#instancesList -->
  </div><!-- /.listframe -->

</div><!-- /#instancesView -->
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<!-- ⚠️ `wizard.js` and `license-details.js` are loaded here for the same reason the
     Invoices page loads them: the License column links to the licence that owns the
     row, and the delegated interceptor in components.js only opens that licence as a
     panel `if(window.LicenseDetails)`. Without them the guard fails silently and the
     link follows its href to the old full-page surface, so this one route would land
     somewhere every other route in the product does not. `wizard.js` comes with it
     because the panel's own actions call into `NL`. -->
<script src="components.js"></script>
<script src="wizard.js"></script>
<script src="license-details.js"></script>
<script src="page-instances.js"></script>
</body>
</html>
