<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invoices — ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="invoices" data-nav="invoices" data-title="Invoices">

<div id="shellMain">
<div class="licview" id="invoicesView">
  <h1 class="lic-h1">Invoices</h1>
  <div class="listcard">
  <div class="insttoolbar">
    <div class="searchbox"><svg class="icon searchglyph" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="text" placeholder="Search invoices" aria-label="Search invoices"></div>
    <span class="spacer"></span>
    <button class="iconbtn ib" data-refresh aria-label="Refresh" title="Refresh"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
  </div>
  </div>

  <div class="listcard">
  <table>
    <thead>
      <tr>
        <th>Invoice #</th>
        <th class="sortable" aria-sort="descending" tabindex="0">Date <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span></th>
        <th class="num">Amount</th>
        <!-- an auto-charge icon rides next to the status chip for invoices the system
             charged on its own; Payment type said the same thing in a word and spent a
             whole column doing it -->
        <th>Status</th>
        <th class="lic-prodhead">Product</th>
        <th aria-label="Invoice actions"></th>
      </tr>
    </thead>
    <!-- rows come from the dataset — see renderInvoicesPage -->
    <tbody></tbody>
  </table>
  <div class="pager air">
    <span class="spacer"></span>
    <span>Items per page<select aria-label="Items per page"><option>10</option><option>20</option><option>50</option><option>100</option></select></span>
    <span class="range">1–7 of 7</span>
    <span class="pagebtns">
      <button disabled aria-label="First page">«</button><button disabled aria-label="Previous page">‹</button><button disabled aria-label="Next page">›</button><button disabled aria-label="Last page">»</button>
    </span>
  </div>
  </div>
</div>
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="components.js"></script>
<script src="page-invoices.js"></script>
</body>
</html>
