<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invoices — ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="invoices" data-nav="invoices" data-title="Invoices">

<div id="shellMain">
<div class="licview" id="invoicesView">
  <!-- ⚠️ ONE FRAME: toolbar, column row and rows are one block, so they are one thing to
       read and, on scroll, one thing that stays. Nothing loose between the title and the
       frame. `.stickybar` is the toolbar, `.stickyhead` the column row; the offset the
       column row sticks at is the toolbar's MEASURED height (`--barH`), because this
       toolbar is a different height on every page and wraps at narrow widths. -->
  <!-- ⚠️ THE TITLE IS INSIDE THE FRAME. It was above it, and the frame began at the
       toolbar; the page then read as a loose heading followed by a box. One block now:
       title, toolbar, column row, rows. The title still SCROLLS AWAY — it is in the
       frame, not in the sticky part of it. -->
  <div class="listcard listframe">
  <h1 class="lic-h1">Invoices</h1>
  <div class="insttoolbar stickybar">
    <div class="searchbox"><svg class="ic searchglyph" aria-hidden="true"><use href="assets/icons.svg#ti-search"></use></svg><input type="text" placeholder="Search invoices" aria-label="Search invoices"></div>
    <span class="spacer"></span>
    <button class="iconbtn ib" data-refresh aria-label="Refresh" title="Refresh"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-refresh"></use></svg></button>
  </div>

  <!-- ⚠️ THE TABLE NEEDS ITS WRAPPERS, and their absence is what made this page's side
       padding disagree with every other list. `.listframe > *` pads its children by
       18px; on Licenses and Instances that child is a plain div holding `.tablescroll`,
       so the padding lands on the div and the table fills it. Here the `<table>` WAS the
       direct child, so the 18px landed on the table element itself — which lays out its
       own box differently, so the columns, the sticky column rule and the rows all sat
       on a different inset from the toolbar above them. Same two wrappers as the other
       two pages now; nothing about the table changed. -->
  <div id="invoicesList">
  <div class="tablescroll">
  <table>
    <thead class="stickyhead">
      <tr>
        <th>Invoice #</th>
        <th class="sortable" aria-sort="descending" tabindex="0">Date <span class="arrow" aria-hidden="true"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></span></th>
        <th class="num">Amount</th>
        <!-- an auto-charge icon rides next to the status chip for invoices the system
             charged on its own; Payment type said the same thing in a word and spent a
             whole column doing it -->
        <th>Status</th>
        <th class="lic-prodhead">Product</th>
        <th aria-label="Invoice actions"></th>
      </tr>
    </thead>
    <!-- rows come from the dataset — see renderInvoicesPage -->
    <tbody></tbody>
  </table>
  </div>
  <div class="pager air">
    <span class="spacer"></span>
    <span>Items per page<select aria-label="Items per page"><option>10</option><option>20</option><option>50</option><option>100</option></select></span>
    <span class="range">1–7 of 7</span>
    <span class="pagebtns">
      <button disabled aria-label="First page"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevrons-left"></use></svg></button><button disabled aria-label="Previous page"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-left"></use></svg></button><button disabled aria-label="Next page"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-right"></use></svg></button><button disabled aria-label="Last page"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevrons-right"></use></svg></button>
    </span>
  </div>
  </div><!-- /#invoicesList -->
  </div><!-- /.listframe -->
</div>
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<!-- ⚠️ `wizard.js` and `license-details.js` are loaded HERE, on a page that has no
     licence table of its own, and the reason is the Product column. Each invoice links
     to the licence it bills, and the delegated interceptor in components.js opens that
     licence as a MODAL — but only `if(window.LicenseDetails)`. Without the module the
     guard failed silently and the link followed its href to license.html, so this one
     route landed on the old full-page surface while every other route in the product
     opened the panel. `wizard.js` comes with it because the panel's own actions
     (Change plan, Manage) call into `NL`. Order per NOTES: data → shared → components
     → wizard → page-*. -->
<script src="components.js"></script>
<script src="wizard.js"></script>
<script src="license-details.js"></script>
<script src="page-invoices.js"></script>
</body>
</html>
