<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Account — ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="account" data-nav="" data-title="Account" data-mesh>

<!-- The ground: the same gradient Home and the landing page carry, injected by the same
     markup and styled by the same rules (see "Home: animated mesh gradient" in
     styles.css). `data-mesh` on <body> is the switch — it is what turns the body into
     a stacking context, drops the grounds that would paint over the layer, and rests
     the top bar on it. -->
<div class="meshbg" aria-hidden="true">
  <span class="mb-lav"></span><span class="mb-cream2"></span><span class="mb-cream"></span><span class="mb-lav2"></span>
</div>


<div id="shellMain">
<div class="licview" id="profileView">
 <div class="setgrid">
  <div class="setcol">
  <!-- ⚠️ ONE FRAME for the whole page. It used to be a page header floating on the grey
       background plus a separate white card titled "Personal details" — two containers
       and two titles for a page that has one subject. The card is the page now: its
       header carries the page name and the page's actions, and everything below is
       inside it, divided rather than boxed.
       The header stays STICKY (inside the card, not above it) — Save has to stay
       reachable while you are in the fields below it, which is why it was sticky
       before. -->
  <div class="setcard setcard-page">
    <div class="setcard-h setcard-h-page">
      <h1 class="lic-h1">Account</h1>
      <span class="sp"></span>
      <!-- Signing out is a global session action, so it stays in the profile menu and
           is not duplicated here. No "all saved" text: Save's disabled state already
           says there is nothing to save. -->
      <a class="btn btn--secondary btn--md" href="security.html">Change password</a>
      <button class="btn btn--primary btn--md" id="profSaveBtn">Save</button><span class="savednote" id="profSaveBtnNote" hidden></span>
    </div>

    <div class="field2">
      <div class="field"><label for="prof-first">First name</label><input id="prof-first" data-field="first" type="text" value="Mariia"></div>
      <div class="field"><label for="prof-last">Last name</label><input id="prof-last" data-field="last" type="text" value="Panchuk"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="profEmail" value="mpanchuk@thingsboard.io">
        <div class="help" id="emailHelp">Used to sign in. Changing it needs confirmation from the new address — this one stays active until then.</div>
        <!-- Pending change: the input keeps showing the address that actually works,
             and this one line takes the helper's place — the value that is waiting
             plus the two ways out. Prototype: clicking the value plays the
             confirmation that would arrive from the new address. -->
        <div class="emailpend" id="emailPending" hidden>
          <svg class="ic emailpend-ic" aria-hidden="true"><use href="assets/icons.svg#ti-clock"></use></svg>
          <button class="emailpend-v" id="emailPendingTxt" title="Prototype: click to play the confirmation"></button>
          <button class="link" id="emailResend">Resend</button>
          <span class="emailpend-sep" aria-hidden="true">&middot;</span>
          <button class="link" id="emailCancel">Cancel</button>
        </div>
      </div>
      <div class="field"><label for="prof-lang">Language</label><span class="selwrap"><select id="prof-lang" data-field="lang"><option>English</option><option>Українська</option><option>Deutsch</option><option>Español</option></select><svg class="ic selchev" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></span></div>
    </div>

    <!-- quiet, low-emphasis delete: a muted text link below a divider; the friction
         lives in the confirm dialog, not on the page -->
    <div class="setdiv"></div>
    <div class="setdelete">
      <!-- ⚠️ THE DESTRUCTIVE TONE, not a second variant (2026-09-28, by request). The
           button model has an axis for exactly this: the VARIANT decides the shape and
           the TONE decides which colour the surface is made of. `text` + `destructive`
           is a red text button — the quietest shape the page can give the one action
           that cannot be undone, in the colour that says so. -->
      <button class="btn btn--text btn--md btn--destructive" id="deleteAcctBtn">Delete account</button>
      <div class="cardhelp" style="margin-top:4px">Removes your profile and access. Active licenses and billing history are not affected. You'll confirm on the next step.</div>
    </div>
  </div>

  </div><!-- /setcol -->
 </div><!-- /setgrid -->
</div>
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="components.js"></script>
<script src="page-account.js"></script>
</body>
</html>
