<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Billing & payment — ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="billing" data-nav="">

<div id="shellMain">
<div class="licview" id="billingView">
 <div class="setgrid">
  <div class="setcol">
  <!-- sticky page header: one Save for the whole page (billing address edits) -->
  <div class="pagehead">
    <h1 class="lic-h1">Billing &amp; payment</h1>
    <span class="sp"></span>
    <button class="btn" id="billSaveBtn" disabled>Save</button>
  </div>
  <div class="setcard">
    <div class="setcard-h"><h2>Payment method</h2><span class="setcard-hint">Charged automatically for recurring plans</span></div>
    <div class="paycard">
      <span class="brandbadge">VISA</span>
      <span class="pc-num">•••• •••• •••• 4242</span>
      <span class="pc-exp">Expires 12 / 2028</span>
      <span class="sp"></span>
      <button class="iconbtn ib" id="payUpdateBtn" aria-label="Update payment method" title="Update payment method"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </div>
  </div>

  <div class="setcard">
    <div class="setcard-h"><h2>Billing address</h2><span class="setcard-hint">Printed on every invoice</span></div>
    <!-- company profile address is filled, so these start prefilled from it; after this
         they are independent copies — no live link, no toggle, no status states -->
    <div class="field"><label>Billing email</label><input type="email" value="hello@thingsboard.io"></div>
    <div class="field2">
      <div class="field"><label>Country</label><select><option>United States</option><option>Ukraine</option><option>Germany</option><option>United Kingdom</option></select></div>
      <div class="field"><label>State / Province</label><input type="text" value="New York"></div>
      <div class="field"><label>City</label><input type="text" value="New York"></div>
      <div class="field"><label>ZIP / Postal code</label><input type="text" value="10001"></div>
    </div>
    <div class="field"><label>Address</label><input type="text" value="500 7th Avenue"></div>
    <div class="field"><label>Address line 2</label><input type="text" value=""></div>
  </div>
  </div><!-- /setcol -->
 </div><!-- /setgrid -->
</div>
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="components.js"></script>
<script src="page-billing.js"></script>
</body>
</html>
