<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Licenses — ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="licenses" data-nav="licenses" data-title="Licenses">

<div id="shellMain">
<div class="licview" id="licensesView">
  <!-- ⚠️ THE H1 IS STILL HERE, AND IT IS STILL THE PAGE'S ONE HEADING — it is only
       visually hidden. The page name appeared twice, as the heading and again as the
       first tab, so the tabs take over the title's visual weight and the standalone
       heading goes. What must NOT go with it is the structure: a page needs a heading,
       and a tablist is a tablist, not a title. So both survive, each doing its own job —
       the h1 for structure and assistive tech, the tabs as tabs. -->
  <h1 class="lic-h1 vh">Licenses</h1>

  <div class="listcard">

  <!-- ⚠️ ROW ONE IS THE PAGE TITLE NOW. The view toggle already said "Licenses" one line
       under an h1 that said "Licenses", so it moved up and took the title's place; it
       keeps its own type size rather than borrowing the h1's, because a tab that looks
       like a heading stops looking pressable.
       It still holds the page's actions on its right — see the note below, and the
       measurement that put them there rather than in the filter row.
       ⚠️ A VIEW TOGGLE, NOT A NAV DESTINATION: a typical customer runs two to five
       instances, and a top-level page for five rows costs more attention than it
       returns. Same page, same toolbar, two ways of slicing the same data. -->
  <div class="lic-controls lic-viewrow lic-titlerow">
    <div class="tabs lic-viewseg" role="tablist" aria-label="View">
      <button class="tab lic-viewtab on" role="tab" aria-selected="true" data-view="licenses">Licenses</button>
      <button class="tab lic-viewtab" role="tab" aria-selected="false" data-view="instances">Instances</button>
    </div>
    <span class="spacer"></span>
    <!-- ⚠️ THE ACTIONS SIT ON ROW ONE, and this is the one place the two-row split was
         asked for differently — "the tab menu alone". Two reasons, and the second is
         measured. First: row two is meant to be "search and all filters", and neither
         Refresh nor + New license is a filter; leaving them there kept the crowding the
         split was for, just on a shorter line. Second, the phone: the primary renders
         as a full-width 48px block, and inside the filter row it pushed the first row
         of the list to y=372 on an 844px screen — the toolbar alone was 236px, 28% of
         the viewport. On row one it costs nothing extra, because that row exists
         anyway. Measured after: 176px. -->
    <button class="iconbtn ib" data-refresh aria-label="Refresh" title="Refresh"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
    <button class="btn" id="licNewBtn"><span class="lnb-plus" aria-hidden="true">+</span><span class="lnb-txt"> New license</span></button>
  </div>

  <div class="lic-controls lic-filterrow">
    <div class="searchbox"><svg class="icon searchglyph" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="text" placeholder="Search licenses" aria-label="Search licenses"></div>
    <div class="lic-typeseg" role="group" aria-label="Filter by product type">
      <button class="typechip" data-type="Subscription" aria-pressed="false">Subscription</button>
      <button class="typechip" data-type="Perpetual" aria-pressed="false">Perpetual</button>
      <!-- Phone: the canceled switch becomes a filter chip in this same row, so all
           three filters read as one set of chips instead of two kinds of control.
           NOT .typechip — that class is the mutually-exclusive product group, and
           this one is an independent on/off. It mirrors #licCanceled either way, so
           the stored state and the desktop switch stay the single source. -->
      <!-- a hairline between the two KINDS of filter: the pair above is one
           mutually-exclusive group, this one is an independent toggle. Identical
           chips side by side implied they behaved the same way. -->
      <span class="chipdiv mob-only" aria-hidden="true"></span>
      <button class="filterchip cancelchip mob-only" id="licCanceledChip" aria-pressed="false">
        <svg class="icon cc-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>
        <span>Canceled</span></button>
    </div>
    <label class="lic-toggle"><span class="switch"><input type="checkbox" id="licCanceled"><span class="track"></span></span> Display canceled licenses</label>
  </div>
  </div>

  <div class="listcard" id="licensesList">
  <div class="tablescroll">
    <table id="prodTable">
      <thead id="prodHead"></thead>
      <tbody id="prodBody"></tbody>
    </table>
  </div>

  <div class="pager">
    <span class="spacer"></span>
    <span>Items per page<select aria-label="Items per page"><option>10</option><option>20</option><option>50</option></select></span>
    <span class="range" id="licRange">1–4 of 4</span>
    <span class="pagebtns">
      <button disabled aria-label="First page">«</button>
      <button disabled aria-label="Previous page">‹</button>
      <button disabled aria-label="Next page">›</button>
      <button disabled aria-label="Last page">»</button>
    </span>
  </div>
  </div>

  <!-- ============================ INSTANCES VIEW ============================
       The same data sliced by deployment instead of by licence. Nothing about plans
       or money lives here: this view answers "what is running, where, on what
       version, and did it report in". -->
  <div class="listcard" id="instancesList" hidden>
    <!-- ⚠️ A QUIET PERSISTENT LINE, not a banner and not a button. The one thing people
         come to this view to do and cannot guess is detaching, and the reason they need
         it is always the same: they moved a deployment. Copy is what makes the action
         discoverable; a second button would just add a control nobody understands. -->
    <p class="inst-hint">Moved a deployment to a new server? Detach the old instance and
      activate the new one with the same key.</p>
    <!-- states the filter the blocked banner arrived with, and carries the way out of it -->
    <p class="inst-filter" id="instFilter" hidden></p>
    <div class="tablescroll">
      <table id="instTable">
        <thead id="instAllHead"></thead>
        <tbody id="instAllBody"></tbody>
      </table>
    </div>
    <div class="pager">
      <span class="spacer"></span>
      <span class="range" id="instRange">0 of 0</span>
    </div>
  </div>

</div>
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="components.js"></script>
<script src="wizard.js"></script>
<script src="license-details.js"></script>
<script src="page-licenses.js"></script>
</body>
</html>
