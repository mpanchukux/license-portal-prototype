<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Licenses — ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="licenses" data-nav="licenses" data-title="Licenses" data-mesh>

<!-- The ground: the same gradient Home and the landing page carry, injected by the same
     markup and styled by the same rules (see "Home: animated mesh gradient" in
     styles.css). `data-mesh` on <body> is the switch — it is what turns the body into
     a stacking context, drops the grounds that would paint over the layer, and rests
     the top bar on it. -->
<div class="meshbg" aria-hidden="true">
  <span class="mb-lav"></span><span class="mb-cream2"></span><span class="mb-cream"></span><span class="mb-lav2"></span>
</div>


<div id="shellMain">
<div class="licview" id="licensesView">
  <!-- ⚠️ VISIBLE AGAIN. The heading was `.vh` because the view tabs had taken over its
       weight — the page name appeared twice, as an h1 and as the first tab. The tabs are
       gone (Instances is its own destination now), so there is nothing left to carry the
       title and the heading goes back to being one.
       ⚠️ `.vh` now has NO USERS in the product. It stays in the stylesheet and in the
       styleguide as a utility, because the reason it exists — hiding a heading from
       sight without taking it out of the accessibility tree — is not specific to tabs. -->

  <!-- ⚠️ ONE FRAME, and it used to be two cards with the table's own header floating
       inside the second. Toolbar, column row and rows are one block now: they are one
       thing to read and, on scroll, one thing that stays. Nothing loose sits between the
       title and this frame.
       ⚠️ `.stickybar` is the toolbar and `.stickyhead` the column row — see the sticky
       pattern in the styleguide. The offset the column row sticks at is the toolbar's
       measured height (`--barH`, set by wireStickyFrame), not a constant: this toolbar
       is a different height on every page and wraps at narrow widths. -->
  <!-- ⚠️ THE TITLE IS INSIDE THE FRAME. It was above it, and the frame began at the
       toolbar; the page then read as a loose heading followed by a box. One block now:
       title, toolbar, column row, rows. The title still SCROLLS AWAY — it is in the
       frame, not in the sticky part of it. -->
  <div class="listcard listframe">
  <!-- ⚠️ THE COUNT SITS WITH THE TITLE, the same place Home puts it. Home's is a BUTTON
       (it goes somewhere); this one is a CHIP, because on the Licenses page there is
       nowhere left to go — it states how many the account has, and the filters below
       narrow what is shown without changing it. Filled by renderLicenses. -->
  <div class="lic-titlerow">
    <h1 class="lic-h1">Licenses</h1>
    <span class="titlecount" id="licTotal"></span>
  </div>

  <!-- ⚠️ ONE TOOLBAR ROW, and it was two. Row one held refresh and + New license with an
       empty left half where the view tablist used to be; row two held search and the
       filters. Two rows is two things to stick, and the split had no meaning left once
       the tablist went — a toolbar is search, filters and the page's actions. -->
  <div class="lic-controls lic-viewrow lic-filterrow stickybar" id="licBarA">
    <div class="searchbox"><svg class="ic searchglyph" aria-hidden="true"><use href="assets/icons.svg#ti-search"></use></svg><input type="text" placeholder="Search licenses" aria-label="Search licenses"></div>
    <div class="lic-typeseg" role="group" aria-label="Filter by product type">
      <button class="typechip" data-type="Subscription" aria-pressed="false">Subscription<span class="chipcount" data-count="Subscription"></span></button>
      <button class="typechip" data-type="Perpetual" aria-pressed="false">Perpetual<span class="chipcount" data-count="Perpetual"></span></button>
      <!-- Phone: the canceled switch becomes a filter chip in this same row, so all
           three filters read as one set of chips instead of two kinds of control.
           NOT .typechip — that class is the mutually-exclusive product group, and
           this one is an independent on/off. It mirrors #licCanceled either way, so
           the stored state and the desktop switch stay the single source. -->
      <span class="chipdiv mob-only" aria-hidden="true"></span>
      <button class="filterchip cancelchip mob-only" id="licCanceledChip" aria-pressed="true">
        <svg class="ic cc-check" aria-hidden="true"><use href="assets/icons.svg#ti-check"></use></svg>
        <span>Active only</span><span class="chipcount" data-count="active"></span></button>
      <!-- ⚠️⚠️ THE BANNER'S LANDING STATE, MADE VISIBLE (2026-09-28, by request). Home's
           banner has always linked here with `?attention=1`, and the list narrowed — but
           NOTHING ON SCREEN SAID SO and there was no control to undo it. A reader
           arriving from the banner saw five licences where the title said seventeen and
           had only the browser's Back to explain it. This chip IS that state: the link
           presses it, and pressing it again is the way out.
           ⚠️ NOT a `.typechip`. The type chips are a mutually exclusive group answering
           "which kind"; this is an independent on/off answering "is anything wrong", and
           the divider before it is the same one the phone already draws between the two
           kinds of filter in this row. Toolbar B asks the same question inside its Status
           dropdown, where there is room for all four answers. -->
      <span class="chipdiv" aria-hidden="true"></span>
      <button class="filterchip attnchip" id="licAttnChip" aria-pressed="false">
        <svg class="ic cc-check" aria-hidden="true"><use href="assets/icons.svg#ti-check"></use></svg>
        <span>Needs attention</span><span class="chipcount" data-count="attention"></span></button>
    </div>
    <!-- ⚠️ THE SWITCH SAYS THE OPPOSITE OF WHAT IT USED TO, and the default flipped with
         it: `Active only`, ON. The stored key is still `showCanceled` and still means
         what it always meant — the LABEL is inverted, not the state, so nobody's stored
         choice changed meaning underneath them. A switch that is off by default asks the
         reader to turn something on before the list is useful; this one starts useful. -->
    <label class="lic-toggle"><span class="switch"><input type="checkbox" id="licCanceled" checked><span class="track"></span></span> Active only</label>
    <span class="spacer"></span>
    <!-- ⚠️ On the phone these two are MOVED into the page title row by syncTitleRow, and
         that is why they must stay inside a `.lic-controls`: it is the host the mover
         looks for, and where it puts them back above the breakpoint. -->
    <button class="btn btn--secondary btn--md btn--icon" data-refresh aria-label="Refresh" title="Refresh"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-refresh"></use></svg></button>
    <!-- ⚠️ THE MARK IS AN ICON, not a "+" character (the icon rule), and it is hidden
         above 600px: on the desktop the words are the button. On the phone the title
         row shows the mark alone — so removing the character without putting a mark in
         its place would have left an empty black square there. -->
    <button class="btn btn--primary btn--md" id="licNewBtn"><svg class="ic lnb-ic" aria-hidden="true"><use href="assets/icons.svg#ti-plus"></use></svg><span class="lnb-txt">Buy a license</span></button>
  </div>

  <!-- ==========================================================================
       TOOLBAR B — a proposal, live beside the current one (2026-09-28, by request)
       ==========================================================================
       ⚠️ BOTH TOOLBARS ARE IN THE MARKUP and one of them is hidden, rather than one
       toolbar rebuilt by script. Two reasons. The swap is then an attribute and a
       repaint, so the filters already set survive it and the two can be compared
       without starting over; and each toolbar's markup can be READ against the other,
       which is the thing under review.
       ⚠️ THE DROPDOWN IS THE ACTIVITY PAGE'S, NOT A SECOND ONE: `.dropwrap.perctl` +
       `.btn--secondary.perbtn` trigger + `.dropmenu`, the same three classes the period
       and event-type controls wear. Nothing here declares a new menu style, and the
       styleguide says so beside both.
       ⚠️ NO `Active only` SWITCH, and its absence is the proposal. Everything is shown
       until the reader narrows it — a cancelled-but-still-running licence vanishing from
       the default view is the fault this replaces. -->
  <div class="lic-controls lic-barb stickybar" id="licBarB" hidden>
    <div class="searchbox"><svg class="ic searchglyph" aria-hidden="true"><use href="assets/icons.svg#ti-search"></use></svg><input type="text" placeholder="Search licenses" aria-label="Search licenses"></div>
    <!-- the trigger states the current answer, which is what makes a narrowed list
         readable without opening the menu -->
    <div class="dropwrap perctl" id="licTypeCtl">
      <button class="btn btn--secondary btn--md perbtn" aria-haspopup="true" aria-expanded="false" aria-label="License type"><b id="licTypeLabel">All types</b> <svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></button>
      <div class="dropmenu licfiltermenu" id="licTypeMenu" role="menu" hidden></div>
    </div>
    <div class="dropwrap perctl" id="licStatusCtl">
      <button class="btn btn--secondary btn--md perbtn" aria-haspopup="true" aria-expanded="false" aria-label="License status"><b id="licStatusLabel">All statuses</b> <svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></button>
      <div class="dropmenu licfiltermenu" id="licStatusMenu" role="menu" hidden></div>
    </div>
    <span class="spacer"></span>
    <button class="btn btn--secondary btn--md btn--icon" data-refresh aria-label="Refresh" title="Refresh"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-refresh"></use></svg></button>
    <button class="btn btn--primary btn--md" id="licNewBtnB"><svg class="ic lnb-ic" aria-hidden="true"><use href="assets/icons.svg#ti-plus"></use></svg><span class="lnb-txt">Buy a license</span></button>
  </div>

  <!-- ==========================================================================
       TOOLBAR C — B's dropdowns, attention on its own switch (2026-09-29, by request)
       ==========================================================================
       ⚠️ A THIRD TOOLBAR IN THE MARKUP, hidden like B, for the reasons stated above B:
       swapping is an attribute and a repaint, the filters already set survive it, and
       all three can be read against each other in one file.
       ⚠️ WHAT MAKES IT NOT-B, in two places only:
         · `Needs attention` is a SWITCH here, not the fourth item in the Status menu.
           It is the other axis — a licence can be Blocked AND need attention — and in
           the menu it could only ever be chosen INSTEAD of a state. As a switch it
           combines: `Active` + attention is a question B cannot ask.
         · the Status dropdown opens on `Active` rather than on `All statuses`.
       ⚠️⚠️ IT IS A CHIP NOW, NOT A SWITCH (2026-09-30, by request), AND THIS REVERSES
       THE ARGUMENT THAT STOOD HERE. It read: "a chip row is the vocabulary of toolbar A;
       this bar speaks in dropdowns and a switch, and mixing in one chip would make it
       read as a fourth control style rather than as B plus one." What the switch could
       not do is STATE HOW MANY — a filter that cannot say what it would leave you is one
       the reader has to try before they can judge it — and the count is what was asked
       for. The chip is the same component toolbar A uses, so the two bars now answer the
       same question with the same object; only the count's facet differs, because here
       attention combines with a status instead of replacing one. -->
  <div class="lic-controls lic-barb lic-barc stickybar" id="licBarC" hidden>
    <div class="searchbox"><svg class="ic searchglyph" aria-hidden="true"><use href="assets/icons.svg#ti-search"></use></svg><input type="text" placeholder="Search licenses" aria-label="Search licenses"></div>
    <div class="dropwrap perctl" id="licTypeCtlC">
      <button class="btn btn--secondary btn--md perbtn" aria-haspopup="true" aria-expanded="false" aria-label="License type"><b id="licTypeLabelC">All types</b> <svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></button>
      <div class="dropmenu licfiltermenu" id="licTypeMenuC" role="menu" hidden></div>
    </div>
    <div class="dropwrap perctl" id="licStatusCtlC">
      <button class="btn btn--secondary btn--md perbtn" aria-haspopup="true" aria-expanded="false" aria-label="License status"><b id="licStatusLabelC">Active</b> <svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></button>
      <div class="dropmenu licfiltermenu" id="licStatusMenuC" role="menu" hidden></div>
    </div>
    <button class="filterchip attnchip" id="licAttnChipC" aria-pressed="false">
      <svg class="ic cc-check" aria-hidden="true"><use href="assets/icons.svg#ti-check"></use></svg>
      <span>Needs attention</span><span class="chipcount" data-count="attention"></span></button>
    <span class="spacer"></span>
    <button class="btn btn--secondary btn--md btn--icon" data-refresh aria-label="Refresh" title="Refresh"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#ti-refresh"></use></svg></button>
    <button class="btn btn--primary btn--md" id="licNewBtnC"><svg class="ic lnb-ic" aria-hidden="true"><use href="assets/icons.svg#ti-plus"></use></svg><span class="lnb-txt">Buy a license</span></button>
  </div>

  <div id="licensesList">
  <div class="tablescroll">
    <table id="prodTable">
      <thead id="prodHead" class="stickyhead"></thead>
      <tbody id="prodBody"></tbody>
    </table>
  </div>

  <div class="pager">
    <span class="spacer"></span>
    <span>Items per page<span class="selwrap"><select aria-label="Items per page"><option>10</option><option>20</option><option>50</option></select><svg class="ic selchev" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-down"></use></svg></span></span>
    <span class="range" id="licRange">1–4 of 4</span>
    <span class="pagebtns">
      <button type="button" class="btn btn--secondary btn--md btn--icon" disabled aria-disabled="true" aria-label="First page"><svg class="ic btn-ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevrons-left"></use></svg></button>
      <button type="button" class="btn btn--secondary btn--md btn--icon" disabled aria-disabled="true" aria-label="Previous page"><svg class="ic btn-ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-left"></use></svg></button>
      <button type="button" class="btn btn--secondary btn--md btn--icon" disabled aria-disabled="true" aria-label="Next page"><svg class="ic btn-ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevron-right"></use></svg></button>
      <button type="button" class="btn btn--secondary btn--md btn--icon" disabled aria-disabled="true" aria-label="Last page"><svg class="ic btn-ic" aria-hidden="true"><use href="assets/icons.svg#ti-chevrons-right"></use></svg></button>
    </span>
  </div>
  </div>

  </div>

</div>
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="components.js"></script>
<script src="wizard.js"></script>
<script src="license-details.js"></script>
<script src="page-licenses.js"></script>
</body>
</html>
