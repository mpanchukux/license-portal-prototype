<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<!-- data-public: readable signed out. It is also the ONE page that is unreachable
     signed in — both directions of that rule live in guardSession(). -->
<body data-page="landing" data-public data-mesh>


<!-- The same animated mesh gradient Home carries, and the same reasons: decoration
     only (aria-hidden, pointer-events:none), on its own layer under everything, and
     OUTSIDE #shellMain so the top bar can rest on it — #shellMain is the scroll box
     and clips to its own edges. `data-mesh` on the body is what turns on the ground
     rules and the glass bar; wireMeshHeader() in shared.js does the scrolling.
     One renderer, one set of rules, three surfaces — see the "Home: animated mesh
     gradient" block in styles.css. -->
<div class="meshbg" aria-hidden="true">
  <span class="mb-lav"></span><span class="mb-cream2"></span><span class="mb-cream"></span><span class="mb-lav2"></span>
</div>

<!-- ⚠️ GRADIENT VARIANT 2, AND IT IS A SECOND NODE RATHER THAN A REPLACEMENT: variant 1
     above stays exactly as it is, on this page and on the twelve others that carry it,
     and the ⚙ switch decides which of the two is displayed. Only one is ever visible.

     ⚠️ TWO TRIOS, BOTH MOUNTED, AND THAT IS WHAT MAKES THE CROSS-FADE OPACITY-ONLY.
     They are stacked on identical geometry — same centre, same orbit, same size — so
     switching product fades one group out while the other fades in and NOTHING moves.
     Building it as one group whose colours change would animate the colour, which is a
     different picture: the sphere would shift hue through grey on the way across.

     ⚠️ Three blobs per trio, arranged around a shared centre in the upper half. Each
     one is bigger than its offset from that centre, so they overlap heavily and the
     combined falloff reads as one sphere of light rather than three spots. -->
<div class="lmesh" id="landingMesh" aria-hidden="true">
  <div class="lm-trio lm-tb"><span class="lm-1"></span><span class="lm-2"></span><span class="lm-3"></span></div>
  <div class="lm-trio lm-mq"><span class="lm-1"></span><span class="lm-2"></span><span class="lm-3"></span></div>
</div>

<div id="shellMain">
<div class="dashview" id="landingView">
  <div class="dmain">
    <div class="dwrap">

      <!-- The page's own headline. The pricing section below is the whole page, so
           the heading names it rather than selling it: this is the portal's offer
           list, not a marketing site. -->
      <!-- ⚠️ ONE heading, not three. `Welcome` was the largest element on the page and
           carried the least information, and `ThingsBoard Products Pricing` named the
           section the reader was already looking at. The H1 now says what the page is
           FOR, in the same style the section title used — see .lp-sect / --t-h1-*. -->
      <!-- ⚠️ BOTH LINES ARE FILLED BY JS, because both depend on which product the
           session arrived for (see landingHeading / landingLead).
           ⚠️ THE SWAP LINK IS ON THE RIGHT NOW, and this reverses the note that used to
           stand here twice: it argued the link had to end the sentence, because at the
           far right it "floats ~500px from the sentence it answers". That objection is
           real and it is the cost being paid — what is bought is a head row that reads
           as one line instead of a sentence that grows a tail, and a link that sits
           where a page-level switch is looked for. It keeps its own slot in the row
           (see .lp-swap), so the sentence beside it never has to make room. -->
      <div class="dwelcome lp-welcome">
        <div class="dw-txt">
          <h1 class="lp-sect" id="landingHead"></h1>
          <p id="landingLead" class="lp-lead"></p>
        </div>
        <div class="lp-swap" id="landingSwap"></div>
      </div>

      <!-- The purchase wizard's step 1, rendered on the page instead of in a modal:
           the same product cards, the same Subscription / Perpetual tabs and the same
           plan cards with their Select buttons, off the same EC_PLANS data. See
           renderPlanPicker in wizard.js — this page is its second host, not a copy. -->
      <div class="planpicker" id="landingPicker">
        <div id="landingChoices"></div>
        <!-- ⚠️ `.plangroups`, not `.plangrid`: this node holds the two billing GROUPS now, and each group holds its own grid. renderPlanPicker rewrites the class either way, but a lying class in the source is how the next reader loses an hour. -->
        <div class="plangroups" id="landingPlans"></div>
        <!-- the single-set note stays immediately under the cards: it is about them -->
        <div id="landingExtra"></div>
        <!-- ⚠️ BELOW the cards. It was between the tabs and the grid for one pass — the
             argument being that it answers "what do I get whichever of these I pick"
             before the reader reads what separates them. Moved back down on request:
             prices come first, and the baseline reads as the footnote to the row above
             rather than as a wall in front of it. Same node, same renderer as the
             new-user screen on Home. -->
      </div>

      <!-- The pricing page's FAQ, under the plans, switching with the product.
           Filled by renderFAQ (faq.js) from the same render that redraws the head and
           the cards, so one product switch changes all three at once. -->
      <div class="faqsect" id="landingFaq"></div>

    </div>
  </div>
</div>
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="components.js"></script>
<script src="wizard.js"></script>
<script src="auth.js"></script>
<script src="faq.js"></script>
<script src="page-landing.js"></script>
</body>
</html>
