<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Users — ThingsBoard License Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="users" data-nav="users">

<div id="shellMain">
<div class="licview" id="usersView">
  <h1 class="lic-h1">Users</h1>
  <div class="listcard">
  <div class="insttoolbar">
    <div class="searchbox"><svg class="icon searchglyph" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="text" placeholder="Search users" aria-label="Search users"></div>
    <span class="spacer"></span>
    <button class="iconbtn ib" data-refresh aria-label="Refresh" title="Refresh"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
    <button class="btn" id="addUserBtn">+ Add user</button>
  </div>
  </div>

  <div class="listcard">
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th class="sortable" aria-sort="descending" tabindex="0">Created <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span></th>
        <th aria-label="User actions"></th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Dev User</td><td>dev@thingsboard.io</td><td>Aug 02 2026</td><td class="cellact"><span class="rowactions"><button class="link" data-stub="Login as Dev User">Login as →</button><button class="link" data-stub="Delete Dev User">Delete</button></span></td></tr>
      <tr><td>A. Admin</td><td>a.admin@thingsboard.io</td><td>Jul 20 2026</td><td class="cellact"><span class="rowactions"><button class="link" data-stub="Login as A. Admin">Login as →</button><button class="link" data-stub="Delete A. Admin">Delete</button></span></td></tr>
      <tr><td>Mariia Panchuk</td><td>mpanchuk@thingsboard.io</td><td>Jul 17 2026</td><td class="cellact"><span class="rowactions"><button class="link" data-stub="Login as Mariia Panchuk">Login as →</button><button class="link" data-stub="Delete Mariia Panchuk">Delete</button></span></td></tr>
    </tbody>
  </table>
  <div class="pager air">
    <span class="spacer"></span>
    <span>Items per page<select aria-label="Items per page"><option>10</option><option>20</option><option>50</option><option>100</option></select></span>
    <span class="range">1–3 of 3</span>
    <span class="pagebtns">
      <button disabled aria-label="First page">«</button><button disabled aria-label="Previous page">‹</button><button disabled aria-label="Next page">›</button><button disabled aria-label="Last page">»</button>
    </span>
  </div>
  </div>
</div>
</div><!-- /#shellMain -->

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="components.js"></script>
<script src="page-users.js"></script>
</body>
</html>
